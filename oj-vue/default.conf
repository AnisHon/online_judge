error_log  /var/log/nginx/error.log notice;



server {
    listen       80;
    server_name  yantuocode.cn; # 修改为docker服务宿主机的ip
    rewrite ^(.*) https://$server_name$1 permanent;
}

server {

    listen 443 default ssl http2 fastopen=3;  # 1.1版本后这样写
    server_name yantuocode.cn; #填写绑定证书的域名

    ssl_certificate /etc/ssl/certs/yantuocode.cn.pem;  # 指定证书的位置，绝对路径
    ssl_certificate_key /etc/ssl/certs/yantuocode.cn.key;  # 绝对路径，同上

    ssl_session_timeout 5m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2; #按照这个协议配置
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;#按照这个套件配置
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:1m;

    fastcgi_param  HTTPS        on;
    fastcgi_param  HTTP_SCHEME     https;


    location / {

        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }

    error_page 500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://gateway-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 200M;
    }

}



