<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 5rem;
            padding: 0;
            display: flex;
            justify-content: center;
            max-height: 50vh;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #333;
        }
        .code {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            margin: 20px 0;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            letter-spacing: 2px;
        }
        p {
            color: #666;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>NVIDIA</h1>
    <p>您的验证码是:</p>
    <div class="code" th:text="${code}"></div>
    <p>请将该验证码输入到对应表单以完成验证</p>
    <p>如果你没有请求验证码，请无视这次验证码</p>
    <div class="footer">
        &copy; NVIDIA Company. All rights reserved.
    </div>
</div>
</body>
</html>
