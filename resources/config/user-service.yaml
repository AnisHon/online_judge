oj:
  notification-worker:
    # Consumers and fanout are opt-in until the event topology is verified in the target vhost.
    community-enabled: false
    points-enabled: false
    fanout-batch-size: 200
    fanout-poll-interval-ms: 1000
    lease-seconds: 60
  config:
    check-in-award: 10
    default-role-id: 1
    check-max-award: 50
    ac-problem-award-rate: 0.5
    file-base-url: ${OJ_FILE_BASE_URL:/tmp/oj_files}
    default-password: ${OJ_DEFAULT_PASSWORD:}
    captcha-type: MATH

common:
  config:

    captcha-code-lifespan: 120
    email-code-lifespan: 120
