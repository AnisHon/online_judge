spring:
  rabbitmq:
    port: 5672
    host: localhost
    username: anishan
    password: change-this-db-password
    #这个配置是保证提供者确保消息推送到交换机中，不管成不成功，都会回调
    publisher-confirm-type: correlated
    #保证交换机能把消息推送到队列中
    publisher-returns: true
    virtual-host: /judge
    #这个配置是保证消费者会消费消息，手动确认，但是感觉没什么用，所以关掉了
    listener:
      simple:
        # acknowledge-mode: manual
        prefetch: 1
    template:
      mandatory: true