spring:
  web:
    resources:
      add-mappings: false

  mvc:
    throw-exception-if-no-handler-found: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8 # +8 北京时间

feign:
  okhttp:
    enabled: true
  httpclient:
    enabled: false

oj:
  # 开发环境默认保留调试信息；生产 Compose 必须显式注入 OJ_PRODUCT=true。
  product: ${OJ_PRODUCT:false}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

site:
  name: 延拓Code
  icp-number: 津ICP备2025028121号-1
