services:
  oj-mysql:
    build:
      context: resources/sql
      dockerfile: Dockerfile
    container_name: oj-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default
      - oj-net

  oj-redis:
    image: redis:7.4-alpine
    container_name: oj-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - default
      - oj-net

  oj-mq:
    image: rabbitmq:3.13-management
    container_name: oj-mq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_VHOST=/judge
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    networks:
      - default
      - oj-net

  oj-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: oj-minio
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9091}:9090"
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - default
      - oj-net

  oj-nacos:
    image: nacos/nacos-server:v2.4.2
    container_name: oj-nacos
    depends_on:
      oj-mysql:
        condition: service_healthy
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-logs:/home/nacos/logs
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=oj-mysql
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=True
    restart: unless-stopped
    networks:
      - default
      - oj-net

  oj-sandbox:
    build:
      context: resources/sandbox
      dockerfile: Dockerfile
      network: host
    container_name: oj-sandbox
    depends_on:
      - oj-minio
    privileged: true
    shm_size: 512m
    environment:
      - MINIO_URL=http://oj-minio:9000
    ports:
      - "5050:5050"
    networks:
      - default
      - oj-net

  judge-server:
    build:
      context: judge-server
      dockerfile: Dockerfile
    container_name: judge-server
    depends_on:
      - oj-nacos
      - oj-redis
      - oj-sandbox
    restart: unless-stopped
    privileged: true
    volumes:
      - judge-logs:/opt/logs/judge-server
    environment:
      - JUDGE_URL=oj-sandbox:5050
      - NACOS_URL=oj-nacos:8848
      - MINIO_URL=http://oj-minio:9000
      - DB_HOST=oj-mysql
      - REDIS_HOST=oj-redis
      - MQ_HOST=oj-mq
      - MQ_USERNAME=${RABBITMQ_DEFAULT_USER:-admin}
      - MQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MQ_V_HOST=/judge
      - MQ_CONCURRENCY=6
      - MQ_MAX_CONCURRENCY=12
      - GIN_MODE=release

    networks:
      - default
      - oj-net

  content-service:
    build:
      context: content-service
      dockerfile: Dockerfile
      network: host
    container_name: content-service
    depends_on:
      - oj-nacos
      - oj-redis
    restart: unless-stopped
    volumes:
      - content-logs:/opt/logs/content-service
    environment:
      - NACOS_URL=oj-nacos:8848
      - MINIO_URL=http://oj-minio:9000
      - DB_HOST=oj-mysql
      - REDIS_HOST=oj-redis
      - MQ_HOST=oj-mq
      - MQ_USERNAME=${RABBITMQ_DEFAULT_USER:-admin}
      - MQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MQ_V_HOST=/judge
    networks:
      - default
      - oj-net

  problem-service:
    build:
      context: problem-service
      dockerfile: Dockerfile
      network: host
    container_name: problem-service
    depends_on:
      - oj-nacos
      - oj-redis
    restart: unless-stopped
    volumes:
      - problem-logs:/opt/logs/problem-service
    environment:
      - NACOS_URL=oj-nacos:8848
      - MINIO_URL=http://oj-minio:9000
      - DB_HOST=oj-mysql
      - REDIS_HOST=oj-redis
      - MQ_HOST=oj-mq
      - MQ_USERNAME=${RABBITMQ_DEFAULT_USER:-admin}
      - MQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MQ_V_HOST=/judge
    networks:
      - default
      - oj-net

  user-service:
    build:
      context: user-service
      dockerfile: Dockerfile
      network: host
    container_name: user-service
    depends_on:
      - oj-nacos
      - oj-redis
    restart: unless-stopped
    volumes:
      - user-logs:/opt/logs/user-service
    environment:
      - NACOS_URL=oj-nacos:8848
      - MINIO_URL=http://oj-minio:9000
      - DB_HOST=oj-mysql
      - REDIS_HOST=oj-redis
      - MQ_HOST=oj-mq
      - MQ_USERNAME=${RABBITMQ_DEFAULT_USER:-admin}
      - MQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MQ_V_HOST=/judge
    networks:
      - default
      - oj-net

  gateway-server:
    build:
      context: gateway-server
      dockerfile: Dockerfile
      network: host
    container_name: gateway-server
    depends_on:
      - oj-nacos
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - NACOS_URL=oj-nacos:8848
      - SERVER_PORT=80
    networks:
      - default
      - oj-net

  oj-vue:
    build:
      context: oj-vue
      dockerfile: Dockerfile
      network: host
    container_name: oj-vue
    depends_on:
      - gateway-server
      - judge-server
      - problem-service
      - user-service
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - default
      - oj-net

networks:
  oj-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  minio-config:
  nacos-logs:
  judge-logs:
  content-logs:
  problem-logs:
  user-logs:
