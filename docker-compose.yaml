services:
  oj-mysql:
    build:
      context: resources/sql
      dockerfile: Dockerfile
      network: host
    container_name: oj-mysql
    ports:
      - "3306:3306"
    volumes:
      - /opt/mysql/data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=change-this-db-password
    restart: always
    networks:
      - default
      - oj-net

  oj-redis:
    image: redis:latest
    container_name: oj-redis
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - '6379:6379'
    volumes:
      - /opt/redis/data:/data
    command: redis-server --appendonly yes
    networks:
      - default
      - oj-net

  oj-mq:
    image: rabbitmq:management
    container_name: oj-mq
    volumes:
      - /opt/rabbitmq:/var/lib/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    restart: always
    environment:
      - RABBITMQ_DEFAULT_VHOST=/judge
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    networks:
      - default
      - oj-net

  oj-minio:
    image: minio/minio
    container_name: oj-minio
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - /opt/minio/data:/data
      - /opt/minio/config:/root/.minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=change-this-object-storage-password
    restart: always
    networks:
      - default
      - oj-net

  oj-nacos:
    image: nacos/nacos-server:v2.4.2
    container_name: oj-nacos
    depends_on:
      - oj-mysql
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - /opt/nacos/logs:/home/nacos/logs
      - /opt
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=oj-mysql
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=change-this-db-password
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=True
    restart: always
    privileged: true
    networks:
      - default
      - oj-net

  oj-sandbox:
    build:
      context: resources/sandbox
      dockerfile: Dockerfile
      network: host
    container_name: oj-sandbox
    depends_on:
      - oj-minio
    privileged: true
    shm_size: 512m
    environment:
      - MINIO_URL=http://oj-minio:9000
    ports:
      - "5050:5050"
    networks:
      - default
      - oj-net

  judge-server:
    build:
      context: judge-server
      dockerfile: Dockerfile
    container_name: judge-server
    depends_on:
      - oj-nacos
      - oj-redis
      - oj-sandbox
    restart: always
    privileged: true
    environment:
      - JUDGE_URL=oj-sandbox:5050
      - NACOS_URL=oj-nacos:8848
      - MINIO_URL=http://oj-minio:9000
      - DB_HOST=oj-mysql
      - REDIS_HOST=oj-redis
      - MQ_HOST=oj-mq
      - MQ_USERNAME=admin
      - MQ_PASSWORD=admin
      - MQ_V_HOST=/judge
      - MQ_CONCURRENCY=6
      - MQ_MAX_CONCURRENCY=12
      - GIN_MODE=release

    networks:
      - default
      - oj-net

  content-service:
    build:
      context: content-service
      dockerfile: Dockerfile
      network: host
    container_name: content-service
    depends_on:
      - oj-nacos
      - oj-redis
    restart: always
    environment:
      - NACOS_URL=oj-nacos:8848
      - MINIO_URL=http://oj-minio:9000
      - DB_HOST=oj-mysql
      - REDIS_HOST=oj-redis
      - MQ_HOST=oj-mq
      - MQ_USERNAME=admin
      - MQ_PASSWORD=admin
      - MQ_V_HOST=/judge
    networks:
      - default
      - oj-net

  problem-service:
    build:
      context: problem-service
      dockerfile: Dockerfile
      network: host
    container_name: problem-service
    depends_on:
      - oj-nacos
      - oj-redis
    restart: always
    environment:
      - NACOS_URL=oj-nacos:8848
      - MINIO_URL=http://oj-minio:9000
      - DB_HOST=oj-mysql
      - REDIS_HOST=oj-redis
      - MQ_HOST=oj-mq
      - MQ_USERNAME=admin
      - MQ_PASSWORD=admin
      - MQ_V_HOST=/judge
    networks:
      - default
      - oj-net

  user-service:
    build:
      context: user-service
      dockerfile: Dockerfile
      network: host
    container_name: user-service
    depends_on:
      - oj-nacos
      - oj-redis
    restart: always
    environment:
      - NACOS_URL=oj-nacos:8848
      - MINIO_URL=http://oj-minio:9000
      - DB_HOST=oj-mysql
      - REDIS_HOST=oj-redis
      - MQ_HOST=oj-mq
      - MQ_USERNAME=admin
      - MQ_PASSWORD=admin
      - MQ_V_HOST=/judge
    networks:
      - default
      - oj-net

  gateway-server:
    build:
      context: gateway-server
      dockerfile: Dockerfile
      network: host
    container_name: gateway-server
    depends_on:
      - oj-nacos
    restart: always
    ports:
      - "8000:80"
    environment:
      - NACOS_URL=oj-nacos:8848
      - SERVER_PORT=80
    networks:
      - default
      - oj-net

  oj-vue:
    build:
      context: oj-vue
      dockerfile: Dockerfile
      network: host
    container_name: oj-vue
    volumes:
      - /opt/nginx/conf.d:/etc/nginx/conf.d
#      - /opt/nginx/ssl:/etc/ssl
    depends_on:
      - gateway-server
      - judge-server
      - problem-service
      - user-service
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - default
      - oj-net

networks:
  oj-net:
    driver: bridge





